# Publica uma versão nova em Releases, de onde a atualização automática do app baixa.
# Dispara com a tag v<versão>, que tem de bater com o "version" do package.json.
name: Publicar versão

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Os módulos e o hub vão para dentro do app: mantém as quebras de linha do repositório.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Confere a versão do package.json
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json ($tag)."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run gerar
      - run: npm run build
      # Gera sem publicar: o --publish do electron-builder criava a versão duas vezes.
      - run: npx electron-builder --win --x64 --publish never
      - name: Cria a versão com o instalador e o latest.yml
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version: $v$" out/latest.yml || { echo "::error::out/latest.yml não é da versão $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            "out/PainelDeScripts-Setup-$v.exe" "out/PainelDeScripts-Setup-$v.exe.blockmap" out/latest.yml \
            --title "Painel de Scripts $v" --generate-notes --latest
